<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Build Your Framework</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%230e1f19%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%276%27 fill=%27%232abf91%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Syne:wght@400;500;700&display=swap" rel="stylesheet">
<style>:root{
  --dark:#0e1f19; --surface:#17332a; --subtle:#224c3f; --mint:#daebe5; --second:#a1ccbf; --deco:#c1ddd4;
  --muted:#7a9e8e; --accent:#2abf91; --deep:#2d6655; --paper:#f3f8f6; --ink:#0e1f19; --body:#23423a; --rule:#c9dfd7; --tint:#e6f1ec;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter",system-ui,sans-serif;font-size:16.5px;line-height:1.55;color:var(--body);background:var(--paper);-webkit-font-smoothing:antialiased}
h1,h2,h3,.syne{font-family:"Syne",system-ui,sans-serif;color:var(--ink);margin:0}
button{font-family:inherit;cursor:pointer}
.lbl{font-family:"Syne",sans-serif;font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--deep);line-height:1.3}
.app{display:grid;grid-template-columns:300px minmax(0,1fr) 320px;min-height:100vh}

/* ---------- rail (trail map) ---------- */
.rail{background:var(--dark);color:var(--mint);padding:26px 22px 28px;position:sticky;top:0;height:100vh;overflow-y:auto}
.rail .logo{height:17px;display:block;margin-bottom:26px}
.ring{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.ring svg{width:64px;height:64px;flex:0 0 64px}
.ring .pct{font-family:"Syne",sans-serif;font-weight:700;font-size:15px;fill:#fff}
.ring b{display:block;font-family:"Syne",sans-serif;font-weight:700;font-size:15px;color:#fff;line-height:1.2}
.ring span{font-size:13px;color:var(--second)}
.trail{list-style:none;margin:0;padding:0;position:relative}
.trail>li{position:relative;padding:0 0 4px 34px}
.trail>li::before{content:"";position:absolute;left:10px;top:24px;bottom:-4px;width:0;border-left:2px dashed var(--subtle)}
.trail>li:last-child::before{display:none}
.trail>li.done::before{border-left:2px solid var(--accent)}
.node{position:absolute;left:0;top:7px;width:22px;height:22px;border-radius:50%;border:2px solid var(--subtle);background:var(--dark);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--dark);font-weight:700}
.trail>li.done>.node{background:var(--accent);border-color:var(--accent)}
.trail>li.cur>.node{border-color:var(--accent);box-shadow:0 0 0 4px rgba(42,191,145,.18)}
.trail>li.summit>.node{border-radius:6px}
.pbtn{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mint);padding:6px 8px;border-radius:8px}
.pbtn:hover{background:var(--surface)}
.pbtn .pn{font-family:"Syne",sans-serif;font-weight:700;font-size:15px;color:#fff;display:block;line-height:1.25}
.trail>li.todo .pn{color:var(--second)}
.pbtn .pc{font-size:12.5px;color:var(--muted)}
.pbar{height:3px;background:var(--subtle);border-radius:200px;margin:5px 0 2px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:200px;transition:width .3s ease}
.sub{list-style:none;margin:4px 0 8px;padding:0}
.sub button{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;color:var(--second);font-size:13.5px;padding:4px 8px;border-radius:6px;line-height:1.3}
.sub button:hover{background:var(--surface);color:#fff}
.sub button.on{color:#fff;background:var(--surface)}
.dot{flex:0 0 7px;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--muted);transform:translateY(-1px)}
.sub button.ok .dot{background:var(--accent);border-color:var(--accent)}
.railfoot{margin-top:22px;border-top:1px solid var(--subtle);padding-top:14px;font-size:12.5px;color:var(--muted)}
.railfoot button{background:none;border:1px solid var(--subtle);color:var(--second);border-radius:200px;padding:6px 12px;font-size:12px;margin:8px 6px 0 0}
.railfoot button:hover{border-color:var(--accent);color:#fff}
.saved::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px}
.saved.warn::before{background:#e0a23c}

/* ---------- main ---------- */
.main{padding:0 0 90px;min-width:0}
.top{position:sticky;top:0;z-index:5;background:rgba(243,248,246,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);padding:12px 44px;display:flex;align-items:center;gap:16px}
.top .where{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tb{flex:0 0 160px;height:6px;background:var(--rule);border-radius:200px;overflow:hidden}
.top .tb i{display:block;height:100%;background:var(--accent);transition:width .3s ease}
.top .tp{font-family:"Syne",sans-serif;font-weight:700;font-size:13px;color:var(--ink);min-width:38px;text-align:right}
.mbtn{display:none;background:var(--dark);color:#fff;border:0;border-radius:200px;padding:7px 13px;font-size:12.5px}
.screen{max-width:740px;margin:0 auto;padding:38px 44px 0}
.screen h1{font-weight:700;font-size:34px;line-height:1.1;margin:8px 0 12px;letter-spacing:-.01em}
.screen h2{font-weight:700;font-size:20px;margin:30px 0 8px}
.screen h3{font-weight:500;font-size:16.5px;margin:18px 0 6px}
.lead{font-size:19px;line-height:1.45;color:var(--ink);font-weight:500;margin:0 0 14px}
p{margin:0 0 12px}
.small{font-size:14px;color:#4f6f65}
.why{border-left:3px solid var(--deep);padding:2px 0 2px 16px;margin:16px 0}
.why p{margin:4px 0 0}
.f{margin:22px 0 0}
.f label,.f .flabel{display:block;font-weight:700;color:var(--ink);font-size:16.5px;line-height:1.35;margin-bottom:3px}
.help{font-size:14.5px;color:#4f6f65;margin:0 0 8px}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px;resize:vertical;line-height:1.5}
textarea:focus,input[type=text]:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(42,191,145,.18)}
textarea::placeholder,input::placeholder{color:#9db8ae}
.core>label::after,.core>.flabel::after{content:"needed";font-family:"Syne",sans-serif;font-weight:500;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--deep);background:var(--mint);border-radius:200px;padding:2px 8px;margin-left:8px;vertical-align:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{font:inherit;font-size:14.5px;background:#fff;border:1.5px solid var(--rule);color:var(--body);border-radius:200px;padding:7px 14px;line-height:1.3;text-align:left}
.chip:hover{border-color:var(--deep)}
.chip.on{background:var(--surface);border-color:var(--surface);color:#fff}
.chip .pg{margin-left:6px}
.chip.on .pg{background:var(--subtle);color:var(--deco)}
.pg{font-family:"Syne",sans-serif;font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;background:var(--mint);color:var(--deep);border-radius:200px;padding:2px 8px;white-space:nowrap}
.qt{color:var(--ink);font-weight:500}
.quote{border-left:3px solid var(--accent);padding-left:14px;margin:8px 0 10px}
details.ex{background:var(--tint);border-radius:16px;margin:16px 0 0;overflow:hidden}
details.ex summary{list-style:none;cursor:pointer;padding:13px 18px;font-family:"Syne",sans-serif;font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);display:flex;justify-content:space-between;gap:10px}
details.ex summary::-webkit-details-marker{display:none}
details.ex summary::after{content:"Show";color:var(--deep)}
details.ex[open] summary::after{content:"Hide"}
details.ex .exb{padding:0 18px 16px;font-size:15.5px}
.exgrid{display:grid;grid-template-columns:150px 1fr;gap:10px 16px}
.exgrid>.lbl{padding-top:4px;color:var(--ink)}
.card{background:#fff;border:1px solid var(--rule);border-radius:16px;padding:18px 20px;margin:14px 0 0}
.card.dark{background:var(--surface);border-color:var(--surface);color:var(--mint)}
.card.dark .lbl{color:var(--accent)} .card.dark .qt{color:#fff}
.note{background:#fff;border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:10px;padding:12px 16px;font-size:15px;margin:16px 0 0}
.keyq{background:var(--dark);border-radius:16px;padding:20px 22px;margin:18px 0 0}
.keyq .lbl{color:var(--accent)} .keyq div{font-family:"Syne",sans-serif;font-weight:700;font-size:23px;line-height:1.2;color:#fff;margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fw{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.fwc{background:#fff;border:1px solid var(--rule);border-radius:16px;padding:14px 16px;font-size:14.5px}
.fwc h3{margin:2px 0 2px;font-weight:700;font-size:16px}
.fwc .by{font-size:13px;color:#4f6f65;margin-bottom:8px}
.flow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:8px}
.flow span{background:var(--tint);border-radius:200px;padding:3px 10px;font-size:13px;color:var(--ink);font-weight:500}
.flow i{color:var(--accent);font-style:normal;font-weight:700}
.rules{display:grid;gap:10px;margin-top:10px}
.rule{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1.5px solid var(--rule);border-radius:16px;padding:14px 16px;text-align:left;font:inherit;color:inherit;width:100%}
.rule.on{border-color:var(--accent);background:#f0faf6}
.rn{flex:0 0 32px;width:32px;height:32px;border-radius:50%;background:var(--mint);color:var(--ink);font-family:"Syne",sans-serif;font-weight:700;display:flex;align-items:center;justify-content:center}
.rule.on .rn{background:var(--accent)}
.rule h3{margin:0 0 2px;font-size:16.5px}
.rule p{margin:0;font-size:15px}
.row{background:#fff;border:1px solid var(--rule);border-radius:16px;padding:14px 16px 16px;margin-top:12px;position:relative}
.row .rnum{font-family:"Syne",sans-serif;font-weight:700;color:var(--accent);font-size:15px}
.row .del{position:absolute;right:12px;top:10px;background:none;border:0;color:var(--muted);font-size:13px}
.row .del:hover{color:#b3261e}
.row .f{margin-top:12px} .row .f label,.row .flabel{font-size:14.5px}
.add{margin-top:12px;background:#fff;border:1.5px dashed var(--deep);color:var(--deep);border-radius:200px;padding:9px 18px;font-size:14.5px;font-weight:500}
.add:hover{background:var(--tint)}
.tog{display:inline-flex;align-items:center;gap:8px;font-size:14.5px;background:#fff;border:1.5px solid var(--rule);border-radius:200px;padding:6px 14px;color:var(--body)}
.tog.on{background:var(--surface);border-color:var(--surface);color:#fff}
.tog::before{content:"";width:14px;height:14px;border-radius:4px;border:1.5px solid currentColor}
.tog.on::before{background:var(--accent);border-color:var(--accent)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;align-items:stretch}
.pair .draft{background:var(--tint);border-radius:12px;padding:12px 14px;font-size:15px}
.pair .draft .lbl{color:var(--ink);margin-bottom:5px}
.pair .f{margin:0;display:flex;flex-direction:column} .pair textarea{flex:1;min-height:104px}
.strow{background:#fff;border:1px solid var(--rule);border-radius:16px;padding:14px 16px;margin-top:12px}
.strow .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.strow .from{font-size:14px;color:#4f6f65}
.strow .to{font-family:"Syne",sans-serif;font-weight:700;font-size:18px;color:var(--deep)}
.seg{display:inline-flex;border:1.5px solid var(--rule);border-radius:200px;overflow:hidden;margin:10px 0 0;background:#fff}
.seg button{background:none;border:0;padding:7px 16px;font-size:14.5px;color:var(--body)}
.seg button.on{background:var(--surface);color:#fff}
.shapes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.shape{background:#fff;border:1.5px solid var(--rule);border-radius:16px;padding:12px 14px;text-align:left;font:inherit;color:inherit}
.shape.on{border-color:var(--accent);background:#f0faf6}
.shape svg{width:100%;height:46px;display:block;margin-bottom:6px}
.acts .arow{display:flex;gap:10px;align-items:center;margin-top:8px}
.acts .an{font-family:"Syne",sans-serif;font-weight:700;color:var(--accent);width:18px}
.nav{display:flex;gap:12px;align-items:center;margin-top:36px;padding-top:20px;border-top:1px solid var(--rule)}
.btn{background:var(--accent);color:var(--dark);border:0;border-radius:200px;padding:13px 26px;font-family:"Syne",sans-serif;font-weight:700;font-size:15px}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:none;border:1.5px solid var(--rule);color:var(--body);font-weight:500}
.btn.ghost:hover{border-color:var(--deep)}
.btn.dark{background:var(--dark);color:#fff}
.nav .left{margin-right:auto;font-size:13.5px;color:#4f6f65}
/* waypoint */
.way{background:var(--dark);color:var(--mint);border-radius:20px;padding:28px 28px 26px;margin-top:8px;position:relative;overflow:hidden}
.way::after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;background:var(--surface)}
.way>*{position:relative;z-index:1}
.way .lbl{color:var(--accent)} .way h1{color:#fff;font-size:30px;margin:8px 0 8px}
.way p{color:var(--deco)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
.stat{background:var(--surface);border:1px solid var(--subtle);border-radius:14px;padding:10px 16px}
.stat b{display:block;font-family:"Syne",sans-serif;font-size:24px;color:#fff;line-height:1.1}
.stat span{font-size:12.5px;color:var(--second)}
.checks{list-style:none;padding:0;margin:14px 0 0}
.checks li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--rule);font-size:15.5px}
.checks .ck{flex:0 0 22px;width:22px;height:22px;border-radius:50%;border:2px solid var(--rule);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--dark)}
.checks li.ok .ck{background:var(--accent);border-color:var(--accent)}
.checks li .go{margin-left:auto;background:none;border:0;color:var(--deep);font-size:14px;text-decoration:underline;white-space:nowrap}
/* summary one-pager */
.onep{background:#fff;border:1px solid var(--rule);border-radius:20px;padding:30px 32px;margin-top:14px}
.onep .nm{font-family:"Syne",sans-serif;font-weight:700;font-size:36px;line-height:1.05;color:var(--ink)}
.onep .does{font-size:19px;color:var(--ink);font-weight:500;margin:10px 0 0}
.onep h3{font-family:"Syne",sans-serif;font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--deep);margin:24px 0 6px}
.missing{color:#b0672a;font-style:italic}
.stg{display:grid;gap:10px;margin-top:6px}
.sg{border:1px solid var(--rule);border-radius:14px;padding:12px 16px;display:grid;grid-template-columns:34px 1fr;gap:4px 12px}
.sg .n{grid-row:span 3;font-family:"Syne",sans-serif;font-weight:700;font-size:22px;color:var(--accent)}
.sg b{font-family:"Syne",sans-serif;font-size:17px}
.sg p{margin:0;font-size:15px}
.loopline{border:1.5px dashed var(--accent);border-radius:14px;padding:10px 16px;font-size:15px;margin-top:10px}
/* side: framework so far */
.side{border-left:1px solid var(--rule);padding:22px 20px;position:sticky;top:0;height:100vh;overflow-y:auto;background:#fafcfb}
.side h2{font-size:15px;font-weight:700;margin:4px 0 12px}
.sf{border:1px solid var(--rule);border-radius:16px;background:#fff;padding:16px}
.sf .nm{font-family:"Syne",sans-serif;font-weight:700;font-size:21px;line-height:1.15;color:var(--ink)}
.sf .nm.empty{color:#9db8ae}
.sf .blk{margin-top:14px}
.sf .blk p{margin:3px 0 0;font-size:14px}
.sf .empty{color:#9db8ae}
.schips{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.schip{display:flex;gap:8px;align-items:center;border-radius:10px;padding:6px 10px;font-size:14px;background:var(--tint);color:var(--ink);font-weight:500}
.schip.ghost{background:none;border:1px dashed var(--rule);color:#9db8ae;font-weight:400}
.schip i{font-style:normal;font-family:"Syne",sans-serif;font-weight:700;color:var(--accent);font-size:12px}
.built{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px;text-align:center}
.built div{background:var(--tint);border-radius:10px;padding:8px 4px}
.built b{display:block;font-family:"Syne",sans-serif;font-size:19px;color:var(--ink)}
.built span{font-size:11.5px;color:#4f6f65}
.scrim{display:none}
@media (max-width:1240px){
  .app{grid-template-columns:280px minmax(0,1fr)}
  .side{display:none;position:fixed;right:0;top:0;width:min(340px,92vw);z-index:30;box-shadow:-12px 0 40px rgba(0,0,0,.18)}
  .side.open{display:block}
  .mbtn.fwbtn{display:inline-block}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none;position:fixed;left:0;top:0;width:min(320px,90vw);z-index:30}
  .rail.open{display:block}
  .mbtn{display:inline-block}
  .scrim.open{display:block;position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(14,31,25,.5);z-index:20}
  .top{padding:10px 16px}.top .tb{flex-basis:70px}
  .screen{padding:26px 18px 0}.screen h1{font-size:28px}
  .grid2,.pair,.fw,.shapes{grid-template-columns:1fr}
  .exgrid{grid-template-columns:1fr;gap:2px 0}.exgrid>.lbl{padding-top:10px}
}
@media (max-width:1240px){ .scrim.open{display:block;position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(14,31,25,.5);z-index:20} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media print{.rail,.side,.top,.nav{display:none!important}.app{display:block}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail" aria-label="Your progress"></aside>
  <main class="main">
    <div class="top"><button type="button" class="mbtn" data-act="openrail">Map</button><div class="where" id="where"></div><div class="tb"><i id="tbar"></i></div><span class="tp" id="tpct"></span><button type="button" class="mbtn fwbtn" data-act="openside">My framework</button></div>
    <div class="screen" id="screen"><h1>Build your framework</h1><p class="lead">Loading.</p><p>If this message stays for more than a few seconds, this browser is blocking the page or is too old to run it. Try an up-to-date Chrome, Safari, Edge or Firefox, or open the link on another device. Nothing is lost.</p><noscript><p><b>JavaScript is turned off in this browser.</b> Turn it on, or open the link in another browser.</p></noscript></div>
  </main>
  <aside class="side" id="side" aria-label="Your framework so far"></aside>
</div>
<div class="scrim" id="scrim" data-act="closedrawers"></div>
<input type="file" id="restorefile" accept="application/json" hidden>
<script src="./jspdf.umd.min.js"></script>
<script>"use strict";
/* Build Your Framework · online builder for Chris. Quotes are injected from the verified list. */
const Q = {"asking_easier":{"text":"The asking was easier than I had spent thirty years assuming it would be.","page":71,"source":"manuscript"},"booth_kid":{"text":"I am describing what it was like to be the kid in the booth.","page":9,"source":"manuscript"},"booth_wait":{"text":"There was nothing to do but wait, because there was nowhere to go and no one to tell.","page":9,"source":"manuscript"},"borrow_shape":{"text":"I am borrowing the shape of an idea from quantum mechanics, not claiming you are literally a quantum system.","page":15,"source":"manuscript"},"call_truth":{"text":"I remember saying some version of the truth out loud to a stranger for the first time in twenty-three years.","page":14,"source":"manuscript"},"circumstance":{"text":"the problem was circumstance and not chemistry, a different job, a different city, a different year, and the drinking would sort itself out.","page":16,"source":"manuscript"},"daily_return_title":{"text":"The Daily Return","page":106,"source":"manuscript"},"disclosure_unsafe":{"text":"Honest disclosure feels viscerally unsafe, even when the actual environment poses no threat.","page":66,"source":"manuscript"},"entry_moment":{"text":"This is affecting my life, but I am not sure it is serious enough to ask for help.","source":"Positioning brief, section 03"},"every_addiction":{"text":"Every addiction I have ever seen, in whatever form it takes, is doing the same job.","page":10,"source":"manuscript"},"ex_call_ease":{"text":"And instead of the collapse I expected, the shame spiral, the reaching, the familiar descent, there was ease.","page":18,"source":"manuscript"},"guide_connect_q":{"text":"Who could I tell one true thing to?","source":"Framework guide, Connect"},"guide_unsure":{"text":"I am not sure how serious this is, but I would like to talk it through.","source":"Framework guide, Connect openings"},"metaphor_mechanism":{"text":"I am not going to dress up a metaphor as a mechanism.","page":5,"source":"manuscript"},"most_people":{"text":"Most people, it turns out, do want to know. They ask.","page":10,"source":"manuscript"},"need_help":{"text":"I have drifted very far from myself, and I need help to find a way back.","page":14,"source":"manuscript"},"okay_no_argue":{"text":"He did not argue with my resistance, reassure me, or make any promises.","page":33,"source":"manuscript"},"okay_not_debate":{"text":"Not a debate. Not a reassurance. Just okay.","page":24,"source":"manuscript"},"opening_sentence":{"text":"Something isn't working for me. Can we talk about it?","source":"Speaker sheet, section 05"},"physics":{"text":"This is not a metaphor for God. This is physics.","page":15,"source":"manuscript"},"preface_willing":{"text":"Not belief. Not a label. Not a story like mine. Just willingness.","page":3,"source":"manuscript"},"receiver_broken":{"text":"It is because the receiver is broken.","page":10,"source":"manuscript"},"receiver_delivery":{"text":"The attunement gets offered, and you cannot take delivery of it.","page":10,"source":"manuscript"},"sheet_sequence":{"text":"Tension · Recognition · The call · Hope and book · Invitation","source":"Speaker sheet, memory sequence"},"success_line":{"text":"I understand what is troubling me. I do not have to handle it alone. I know who I could talk to and how I could begin.","source":"Positioning brief, section 08"},"they_answered":{"text":"They answered. That is the whole miracle of that day.","page":14,"source":"manuscript"},"told_myself":{"text":"I told myself it was something else. Every time.","page":13,"source":"manuscript"}};
const esc = (s) => String(s === null || s === undefined ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const qt = (id, tag, lead) => { const e = Q[id]; return `<span class="qt">"${lead ? "... " : ""}${esc(e.text)}"</span> <span class="pg">${e.page ? "p. " + e.page : esc(tag || e.source)}</span>`; };

/* ---------------- state ---------------- */
const KEY = "chris-framework-v1";
let storageOK = true, S = null;
try { localStorage.setItem(KEY + "-t", "1"); localStorage.removeItem(KEY + "-t"); S = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { storageOK = false; }
if (!S || typeof S !== "object") S = { a: {}, seen: {}, cur: null };
S.a = S.a || {}; S.seen = S.seen || {};
const A = S.a;
const str = (k) => (typeof A[k] === "string" ? A[k].trim() : "");
const has = (k) => str(k).length > 0;
const arr = (k) => (Array.isArray(A[k]) ? A[k] : []);
const rows = (k, n, blank) => { if (!Array.isArray(A[k])) A[k] = []; while (A[k].length < n) A[k].push(blank()); return A[k]; };
let saveT = null, savedAt = null;
function save() { clearTimeout(saveT); saveT = setTimeout(() => { if (storageOK) { try { localStorage.setItem(KEY, JSON.stringify(S)); savedAt = new Date(); } catch (e) { storageOK = false; } } paintChrome(); }, 350); }

/* ---------------- content ---------------- */
const PARTS = [
  { id: "start", name: "Start here", adds: "Who it is for, and the rules of the build." },
  { id: "moments", name: "Your moments", adds: "The real experiences your framework is built from." },
  { id: "before", name: "Before asking", adds: "The sentences that keep people from asking." },
  { id: "ideas", name: "Your big ideas", adds: "Three ideas, each made teachable." },
  { id: "stages", name: "Your stages", adds: "The stages a person moves through." },
  { id: "name", name: "Name it", adds: "A name and a promise." },
  { id: "summary", name: "Your framework", summit: true },
  { id: "test", name: "Test it", bonus: true },
];
const MAIN = ["start", "moments", "before", "ideas", "stages", "name"];
const CAND = [
  ["c1", "The kid in the booth", "p. 9"], ["c2", "Knowing the signs and choosing another explanation", "p. 13"],
  ["c3", "The call to Bowen Island", "p. 14"], ["c4", "The hemlock tree, six days in", "p. 7, p. 14"],
  ["c5", "Your counselor's Okay", "p. 24"], ["c6", "The call that went unanswered, and the ease that followed", "p. 18"],
  ["c7", "The lost backpack in Tokyo", "p. 19"], ["c8", "Saying it all out loud to your counselor", "p. 52"],
  ["c9", "Your counselor's question about embellishing", "p. 62"], ["c10", "Your friend's poem at three weeks", "p. 93"],
  ["c11", "Asking first before a hard conversation", "p. 98"], ["c12", "The phone that stopped being frightening", "p. 120"],
];
const MF = [
  ["happening", "What was happening", "Where you were. What was going on. Keep it short.", true],
  ["did", "What I actually did", "A real action, not only a realization. What did the realization make you willing or able to do?", true],
  ["helped", "Who or what helped", "A person, a place, a sentence, a habit.", true],
  ["try", "What someone else could try", "A smaller, safer version of your action.", true],
  ["believed", "What I believed", "The rule you were living by at that moment.", false],
  ["changed", "What changed", "What was different afterwards.", false],
  ["notfit", "When this might not fit", "Who should not copy this, and why.", false],
];
const BARRIERS = ["shame", "self-reliance", "fear of labels", "religious expectations", "past rejection", "cost", "access"];
const PS = [["statement", "Statement"], ["explanation", "Explanation"], ["model", "Model"], ["metaphor", "Metaphor"], ["story", "Story"], ["evidence", "Evidence"], ["action", "One small action someone could take"]];
const PS_DEF = { statement: "The idea in one plain sentence.", explanation: "Why it is true, in two or three sentences.", model: "The parts, in order. A list is fine.", metaphor: "An image that makes it easy to hold. Label it as an image.", story: "A short scene from your life that shows it.", evidence: "What supports it beyond your story.", action: "Something a person could do this week because of this idea." };
const SHEETS = [{ id: "A", title: "The broken receiver" }, { id: "B", title: "Okay" }, { id: "C", title: "It's not serious enough" }];
const SR = [
  ["Notice", "Notice", "Kept as it is."],
  ["Journal", "Pause", "Writing becomes one way to pause, not the only way."],
  ["Connect", "Connect", "Kept as it is."],
  ["Part of Connect", "Receive", "New. Taking in the reply gets its own stage."],
  ["Explore, and the Implement half of your last stage", "Explore and try", "Asking questions and trying one thing sit together."],
  ["The Repeat half of your last stage", "Keep going", "A loop around the method, not a stage."],
];
const CRIT = ["Easy to say", "Fits the process", "Fits your voice", "Makes no promise you can't keep", "Different from existing programs"];
const BEATS = [
  ["Tension", "0:00 to 0:25", "The problem, in one true line of your own."],
  ["Recognition", "0:25 to 0:45", "Name the moment before asking, in a young adult's words."],
  ["The call", "0:45 to 1:10", "One short story that shows the idea."],
  ["Hope and the method", "1:10 to 1:40", "Name your stages in one breath."],
  ["Invitation", "1:40 to 2:00", "One thing they can try today."],
];
const TYPES = [["Experience", "It happened to you. Keep it, and say it is yours."], ["Interpretation", "Your reading of what happened. Say \"I think\" or \"in my experience\"."], ["Metaphor", "An image. Label it as an image."], ["Science", "A fact about the world. It needs a source for that exact claim."], ["Untested benefit", "A promise about what the method does. Say \"may\" until it is tested."]];
const CALLS = ["Keep", "Soften", "Needs a source"];
const CLAIM_EX = [["they_answered", "Experience", "Keep"], ["every_addiction", "Interpretation", "Soften"], ["receiver_broken", "Metaphor", "Keep, with a label"], ["physics", "Science", "Needs a source, or soften"]];

/* ---------------- derived ---------------- */
const custom = () => (Array.isArray(A.m_custom) ? A.m_custom : (A.m_custom = []));
const momentTitle = (id) => { const c = CAND.find((x) => x[0] === id); if (c) return c[1]; const u = custom().find((x) => x.id === id); return u ? u.title : ""; };
const momentPage = (id) => { const c = CAND.find((x) => x[0] === id); return c ? c[2] : ""; };
const selMoments = () => arr("m_sel").filter((id) => momentTitle(id).trim());
const stageName = (i) => { const c = A["st_call" + i]; if (c === "rename" && has("st_name" + i)) return str("st_name" + i); return SR[i][1]; };
const finalStages = () => [0, 1, 2, 3, 4].filter((i) => A["st_call" + i] !== "reject").map((i) => ({ i, name: stageName(i) }));
const loopOn = () => A.st_call5 !== "reject";
const sentences = () => rows("sentences", 3, () => ({ s: "", barriers: [], young: false, how: "" }));
const filledSent = () => sentences().filter((r) => (r.s || "").trim());
const names = () => rows("names", 5, () => ({ n: "", t: [0, 0, 0, 0, 0] }));
const finalName = () => { const n = names()[A.name_final]; return n && n.n.trim() ? n.n.trim() : ""; };
const claims = () => rows("claims", 2, () => ({ s: "", type: "", call: "", rw: "" }));
const logRows = () => rows("log", 3, () => ({ date: "", who: "", ex: "Connect", confused: "", produced: "", change: "" }));
const acts = (i) => { const k = "sc" + i + "_acts"; if (!Array.isArray(A[k])) A[k] = ["", "", "", "", ""]; return A[k]; };

/* ---------------- field helpers ---------------- */
const fText = (k, label, help, r, core) => `<div class="f${core ? " core" : ""}"><label for="${k}">${label}</label>${help ? `<p class="help">${help}</p>` : ""}<textarea id="${k}" data-k="${k}" rows="${r || 4}">${esc(A[k] || "")}</textarea></div>`;
const fShort = (k, label, help, core) => `<div class="f${core ? " core" : ""}"><label for="${k}">${label}</label>${help ? `<p class="help">${help}</p>` : ""}<input type="text" id="${k}" data-k="${k}" value="${esc(A[k] || "")}"></div>`;
function fChips(k, label, help, opts, multi, core) {
  const cur = multi ? arr(k) : [A[k]];
  return `<div class="f${core ? " core" : ""}"><div class="flabel">${label}</div>${help ? `<p class="help">${help}</p>` : ""}<div class="chips">${opts.map((o) => {
    const v = Array.isArray(o) ? o[0] : o, t = Array.isArray(o) ? o[1] : o;
    return `<button type="button" class="chip ${cur.includes(v) ? "on" : ""}" data-chip="${multi ? "m" : "s"}" data-k="${k}" data-v="${esc(v)}"${multi && multi > 1 ? ` data-max="${multi}"` : ""}>${t}</button>`;
  }).join("")}</div></div>`;
}
const exBox = (inner, title) => `<details class="ex"><summary>${title || "Example · Draft for Chris to rewrite"}</summary><div class="exb">${inner}</div></details>`;
const lbl = (t) => `<div class="lbl">${t}</div>`;
const why = (t) => `<div class="why">${lbl("Why it matters")}<p>${t}</p></div>`;

/* ---------------- screens ---------------- */
function screens() {
  const L = [];
  const add = (id, part, nav, render, req, extra) => L.push(Object.assign({ id, part, nav, render, req: req || (() => []) }, extra || {}));

  /* ===== Part 0 · Start here ===== */
  add("s_welcome", "start", "Welcome", () => `
    ${lbl("Part 1")}<h1>Build your framework</h1>
    <p class="lead">You already have the story. This turns it into a method other people can use.</p>
    <p>You will work through six parts. Each part adds one piece. At the end the pieces come together on one page: your framework, in your words, with a name and a clear account of who it helps and how.</p>
    <div class="fw">${PARTS.filter((p) => MAIN.includes(p.id)).map((p, i) => `<div class="fwc">${lbl("Part " + (i + 1))}<h3>${p.name}</h3><div>${p.adds}</div></div>`).join("")}</div>
    <div class="note"><b>How it works.</b> One screen at a time. Your answers save on this device as you type, so use the same browser each time. You can stop whenever you like and pick up where you left off. Every example is a draft for you to rewrite. Lines from your manuscript show the page, like <span class="pg">p. 14</span>.</div>
    <div class="note"><b>A note on care.</b> No screen asks for graphic detail. Keep hard scenes short. If writing brings up more than you want to carry alone, stop and reach out to your own support first. This can wait.</div>`);

  add("s_who", "start", "Who it is for", () => `
    ${lbl("Part 1")}<h1>Who this is for</h1>
    <p class="lead">Start with young adults who look fine from the outside.</p>
    <p>They have the job, the place, the plans. On the inside they know that what used to work is now destroying them. Your framework reaches them before it is too late. They do not have to be students. They do not need a label, and they do not need a crisis.</p>
    <div class="card dark">${lbl("Where a person starts")}<p>${qt("entry_moment", "positioning brief")}</p>${lbl("Where they finish")}<p style="margin:4px 0 0">${qt("success_line", "positioning brief")}</p></div>
    ${exBox(`<p><b>Sam, 27.</b> From the outside: a good job, rent paid, never misses the gym, the friend everyone leans on.</p><p>On the inside: drinks most nights to switch off. The mornings are getting harder to hide. Sam knows it, and tells no one.</p><p class="small">Sam is made up. Write your own person. It can be you at 25.</p>`, "Example · A made-up person · Draft for Chris to rewrite")}
    <div class="grid2">${fText("aud_outside", "From the outside, this person looks like", "What everyone else sees.", 4, true)}${fText("aud_inside", "On the inside, what is true?", "What they know and have not said.", 4, true)}</div>
    ${fText("aud_person", "What would you want this person to hear from you?", "One or two sentences. Optional.", 3)}`,
    () => [has("aud_outside"), has("aud_inside")]);

  add("s_field", "start", "What strong frameworks share", () => `
    ${lbl("Part 1")}<h1>What strong frameworks share</h1>
    <p class="lead">Before you build yours, look at five from your field.</p>
    <div class="fw">
      <div class="fwc"><h3>Stages of Change</h3><div class="by">Prochaska and DiClemente</div><div class="flow"><span>Precontemplation</span><i>&rsaquo;</i><span>Contemplation</span><i>&rsaquo;</i><span>Preparation</span><i>&rsaquo;</i><span>Action</span><i>&rsaquo;</i><span>Maintenance</span></div><div><b>What to borrow.</b> It meets people where they are. Not ready is a stage, not a failure.</div></div>
      <div class="fwc"><h3>Motivational Interviewing</h3><div class="by">Miller and Rollnick</div><div class="flow"><span>Engaging</span><i>&rsaquo;</i><span>Focusing</span><i>&rsaquo;</i><span>Evoking</span><i>&rsaquo;</i><span>Planning</span></div><div><b>What to borrow.</b> The person's own reasons do the work. The helper does not push.</div></div>
      <div class="fwc"><h3>R U OK?</h3><div class="by">Australian conversation model</div><div class="flow"><span>Ask</span><i>&rsaquo;</i><span>Listen</span><i>&rsaquo;</i><span>Encourage action</span><i>&rsaquo;</i><span>Check in</span></div><div><b>What to borrow.</b> Four plain verbs. Small enough for one conversation.</div></div>
      <div class="fwc"><h3>The help-seeking model</h3><div class="by">Rickwood and colleagues, 2005</div><div class="flow"><span>Awareness</span><i>&rsaquo;</i><span>Expression</span><i>&rsaquo;</i><span>Availability</span><i>&rsaquo;</i><span>Willingness</span></div><div><b>What to borrow.</b> It maps the ground before a person asks. That is your ground too.</div></div>
      <div class="fwc"><h3>SBIRT</h3><div class="by">Used in health settings</div><div class="flow"><span>Screening</span><i>&rsaquo;</i><span>Brief intervention</span><i>&rsaquo;</i><span>Referral to treatment</span></div><div><b>What to borrow.</b> Early and brief. It acts in minutes, before a crisis.</div></div>
      <div class="fwc" style="background:var(--tint);border-color:var(--tint)"><h3>What they have in common</h3><div class="by">Six things to notice</div><div>Few parts. Plain verbs. A clear way in. One action per part. A shape you can draw. An honest edge: each one says what it does not do.</div></div>
    </div>
    <p class="small" style="margin-top:12px">These are here so you can see what strong frameworks share. Yours stays your own. Check the original source before you name any of them in public.</p>
    ${fChips("fw_elements", "Which of these do you want yours to have?", "Pick as many as fit.", ["3 to 6 parts", "Plain verbs", "A clear way in", "One small action per part", "A shape you can draw", "Room to say no", "Says what it is not", "Works without a label"], true, true)}
    ${fText("fw_admire", "A framework you admire, from any field. What makes it work?", "Optional. The outdoors and the classroom both count.", 3)}`,
    () => [arr("fw_elements").length > 0]);

  add("s_rules", "start", "Three rules", () => `
    ${lbl("Part 1")}<h1>Three rules for the build</h1>
    <p class="lead">Tap each rule once you agree to it.</p>
    <div class="rules">${[
      ["Your own method", "It stands on its own. AA belongs in your story, credited honestly. Its words stay out of your framework."],
      ["Physics is optional", "You can use it as an image, with a label that says so. It is never the reason the method works."],
      ["Readiness, not recovery", "The method ends when a person knows who to talk to and how to begin. Ongoing care sits outside it."],
    ].map(([h, p], i) => `<button type="button" class="rule ${A["rule" + i] ? "on" : ""}" data-act="rule" data-i="${i}"><span class="rn">${A["rule" + i] ? "✓" : i + 1}</span><span><h3>${h}</h3><p>${p}</p></span></button>`).join("")}</div>
    <div class="note">You already hold yourself to the second rule. From your preface: ${qt("metaphor_mechanism")}</div>`,
    () => [!!A.rule0, !!A.rule1, !!A.rule2]);

  add("s_way", "start", "Waypoint", () => waypoint("start", "You know who it is for.", "The ground is set. Next you collect the raw material: the moments from your own life.",
    [[str("aud_outside") ? "1" : "0", "person described"], [String(arr("fw_elements").length), "features chosen"]],
    [[has("aud_outside") && has("aud_inside"), "You described the person, outside and inside.", "s_who"], [arr("fw_elements").length > 0, "You chose what your framework should have.", "s_field"], [A.rule0 && A.rule1 && A.rule2, "You agreed to the three rules.", "s_rules"]]), null, { way: true });

  /* ===== Part 1 · Your moments ===== */
  add("m_pick", "moments", "Choose your moments", () => {
    const n = selMoments().length;
    return `${lbl("Part 2")}<h1>Your moments</h1>
    <p class="lead">Collect the moments that changed how you ask for help, and how you let it in.</p>
    ${why("These moments are the raw material for everything else. A framework built from real moments sounds like you. One built from ideas alone sounds like everyone.")}
    <div class="keyq">${lbl("The question to ask of every moment")}<div>What did that realization make you willing or able to do?</div></div>
    <div class="f core"><div class="flabel">Pick from your manuscript</div><p class="help">Five is the minimum. Eight to ten is ideal. Small moments count. A moment where help did not work counts too.</p>
      <div class="chips">${CAND.map(([id, t, p]) => `<button type="button" class="chip ${arr("m_sel").includes(id) ? "on" : ""}" data-chip="m" data-k="m_sel" data-v="${id}">${t} <span class="pg">${p}</span></button>`).join("")}</div></div>
    <div class="f"><div class="flabel">Add moments that are not in the book</div>
      ${custom().map((u, i) => `<div class="acts"><div class="arow"><input type="text" data-custom="${i}" value="${esc(u.title)}" placeholder="Give the moment a short title"><button type="button" class="tog ${arr("m_sel").includes(u.id) ? "on" : ""}" data-chip="m" data-k="m_sel" data-v="${u.id}">Use it</button></div></div>`).join("")}
      <button type="button" class="add" data-act="addcustom">Add a moment of your own</button></div>
    <p class="small" style="margin-top:16px"><b>${n}</b> picked. ${n < 5 ? (5 - n) + " more to reach the minimum." : n < 8 ? "Good. " + (8 - n) + " more would give you a strong set." : "A strong set."}</p>`;
  }, () => [selMoments().length >= 5]);

  selMoments().forEach((id, idx, all) => {
    add("m_card_" + id, "moments", momentTitle(id), () => `
      ${lbl("Moment " + (idx + 1) + " of " + all.length)}<h1>${esc(momentTitle(id))}</h1>
      ${momentPage(id) ? `<p><span class="pg">${momentPage(id)}</span> <span class="small">in your manuscript</span></p>` : ""}
      <p>One or two plain sentences per box is enough. Leave out graphic detail.</p>
      ${exBox(`<div class="exgrid">
        ${lbl("What was happening")}<div>You had run out of ways to manage alone. You phoned a treatment centre on Bowen Island. <span class="small">Paraphrase. The hard details are left out on purpose.</span></div>
        ${lbl("What I actually did")}<div>You called. You said one true thing to a stranger.<div class="quote">${qt("call_truth")}</div></div>
        ${lbl("Who or what helped")}<div>A stranger who picked up.<div class="quote">${qt("they_answered")}</div></div>
        ${lbl("What someone else could try")}<div>Say one true sentence out loud to one person. It can be a stranger whose job is to listen, such as a helpline.</div>
        ${lbl("What changed")}<div>Six days later an honest thought arrived.<div class="quote">${qt("need_help")}</div></div>
        ${lbl("When this might not fit")}<div>Most people are far from this point. Their version is smaller and earlier. A call is not always answered the first time, so they need a backup.</div>
      </div>`, "See a filled card · The call to Bowen Island · Draft for Chris to rewrite")}
      ${MF.filter((f) => f[3]).map(([k, t, h]) => fText("m_" + id + "_" + k, t, h, 3, true)).join("")}
      <h2>Go deeper</h2><p class="small">Optional, and worth it for your strongest moments.</p>
      ${MF.filter((f) => !f[3]).map(([k, t, h]) => fText("m_" + id + "_" + k, t, h, 3)).join("")}`,
      () => MF.filter((f) => f[3]).map(([k]) => has("m_" + id + "_" + k)));
  });

  add("m_top", "moments", "Your strongest three", () => {
    const sm = selMoments();
    return `${lbl("Part 2")}<h1>Your strongest three</h1>
    <p class="lead">Which three moments matter most to you?</p>
    <p>These will anchor your stages later. Choose the ones you could tell in your sleep.</p>
    ${sm.length ? fChips("m_top", "Pick up to three", "", sm.map((id) => [id, esc(momentTitle(id))]), 3, true) : `<div class="note">Choose your moments first.</div>`}
    ${fText("m_pattern", "What do your strongest moments have in common?", "Optional. This is often the first sign of your framework.", 3)}
    <div class="note">A quieter moment can be as strong as a big one. From your manuscript, two weeks into treatment: ${qt("ex_call_ease")}</div>`;
  }, () => [arr("m_top").filter((id) => selMoments().includes(id)).length >= Math.min(3, Math.max(1, selMoments().length))]);

  add("m_way", "moments", "Waypoint", () => {
    const sm = selMoments(), withAct = sm.filter((id) => has("m_" + id + "_did")).length;
    return waypoint("moments", "You have your raw material.", "Every stage you build from here can point back to something that really happened.",
      [[String(sm.length), "moments"], [String(withAct), "with a real action"], [String(arr("m_top").length), "strongest picked"]],
      [[sm.length >= 5, sm.length >= 8 ? "You have eight or more moments." : `You have at least five moments. You have ${sm.length}; eight to ten is ideal.`, "m_pick"],
       [sm.length > 0 && withAct === sm.length, "Every moment has a real action, not only a realization.", sm.find((id) => !has("m_" + id + "_did")) ? "m_card_" + sm.find((id) => !has("m_" + id + "_did")) : "m_pick"],
       [arr("m_top").length >= Math.min(3, Math.max(1, sm.length)), "You picked your strongest three.", "m_top"]]);
  }, null, { way: true });

  /* ===== Part 2 · Before asking ===== */
  add("b_list", "before", "Your sentences", () => `
    ${lbl("Part 3")}<h1>The moment before asking</h1>
    <p class="lead">Name the sentences you used to avoid asking for help.</p>
    ${why("Most people know help exists. What stops them is a sentence they tell themselves. If you can name your sentences, you can help someone else hear their own.")}
    ${exBox(`<p><b>Sentences from your manuscript</b></p><div class="quote">${qt("told_myself")}</div><div class="quote">${qt("circumstance", null, true)}</div><div class="quote">${qt("disclosure_unsafe")}</div>
      <p><b>How a young adult might say it</b></p><div class="quote"><span class="qt">"My job is going fine, so it can't be that bad."</span> <span class="pg">made up</span></div>
      <p class="small">Our guess at the barriers: fear of labels for the first line, self-reliance for the second, past rejection for the third. Change these if we have it wrong.</p>`)}
    <p class="small" style="margin-top:14px">The seven barriers come from your positioning brief. Write the exact words you used, to yourself or to other people. Three is the minimum; six is better.</p>
    ${sentences().map((r, i) => `<div class="row"><span class="rnum">${i + 1}</span>${sentences().length > 3 ? `<button type="button" class="del" data-act="delrow" data-list="sentences" data-i="${i}">Remove</button>` : ""}
      <div class="f"><label>The sentence I used</label><input type="text" data-list="sentences" data-i="${i}" data-f="s" value="${esc(r.s)}"></div>
      <div class="f"><div class="flabel">Which barrier is underneath it?</div><div class="chips">${BARRIERS.map((b) => `<button type="button" class="chip ${(r.barriers || []).includes(b) ? "on" : ""}" data-act="barrier" data-i="${i}" data-v="${b}">${b}</button>`).join("")}</div></div>
      <div class="f"><button type="button" class="tog ${r.young ? "on" : ""}" data-act="young" data-i="${i}">A young adult would say this too</button></div>
      <div class="f"><label>How might they say it?</label><input type="text" data-list="sentences" data-i="${i}" data-f="how" value="${esc(r.how)}"></div></div>`).join("")}
    <button type="button" class="add" data-act="addrow" data-list="sentences">Add another sentence</button>`,
    () => { const f = filledSent(); return [f.length >= 3, f.length > 0 && f.every((r) => (r.barriers || []).length > 0), f.filter((r) => r.young).length >= 2]; });

  add("b_one", "before", "The one that mattered", () => {
    const f = filledSent();
    return `${lbl("Part 3")}<h1>The one that mattered</h1>
    <p class="lead">Which sentence do you most wish someone had questioned?</p>
    ${f.length ? fChips("b_one", "Choose one", "", f.map((r) => [r.s.trim(), esc(r.s.trim())]), false, true) : `<div class="note">Write your sentences first.</div>`}
    ${fText("b_one_why", "What might have happened if someone had questioned it?", "Two or three sentences.", 4)}
    <div class="note">Something to hold on to, from your manuscript: ${qt("asking_easier")}</div>`;
  }, () => [has("b_one") && filledSent().some((r) => r.s.trim() === str("b_one"))]);

  add("b_way", "before", "Waypoint", () => {
    const f = filledSent();
    return waypoint("before", "You can hear the sentences now.", "These are the walls your framework has to get past. Next you turn three of your ideas into something teachable.",
      [[String(f.length), "sentences"], [String(new Set(f.reduce((all, r) => all.concat(r.barriers || []), [])).size), "barriers named"], [String(f.filter((r) => r.young).length), "a young adult would say"]],
      [[f.length >= 3, f.length >= 6 ? "You have six or more sentences." : `You have at least three sentences. You have ${f.length}; six is better.`, "b_list"],
       [f.length > 0 && f.every((r) => (r.barriers || []).length), "Each sentence has a barrier.", "b_list"],
       [f.filter((r) => r.young).length >= 2, "At least two are sentences a young adult would say.", "b_list"],
       [has("b_one"), "You chose the one you wish someone had questioned.", "b_one"]]);
  }, null, { way: true });

  /* ===== Part 3 · Your big ideas ===== */
  add("i_intro", "ideas", "How an idea sheet works", () => `
    ${lbl("Part 4")}<h1>Your big ideas</h1>
    <p class="lead">Turn three of your ideas into one sheet each, so each idea can stand on its own.</p>
    ${why("An idea is easier to teach when it has a plain statement, a picture, a story and one thing to do. A sheet holds all of that. It also shows you quickly where an idea is still thin.")}
    <h2>The seven parts of a sheet</h2>
    <div class="fw">${PS.map(([k, t]) => `<div class="fwc">${lbl(t)}<div>${PS_DEF[k]}</div></div>`).join("")}</div>
    <p class="small" style="margin-top:12px">The format is the pink sheet from Matt Church and Peter Cook's book Think, as noted in our framework guide.</p>
    <h2>Your three ideas</h2>
    <div class="fw"><div class="fwc">${lbl("Idea A")}<h3>The broken receiver</h3><div>Half filled from your manuscript.</div></div><div class="fwc">${lbl("Idea B")}<h3>Okay</h3><div>Blank, with prompts.</div></div><div class="fwc">${lbl("Idea C")}<h3>It's not serious enough</h3><div>Blank, with prompts.</div></div><div class="fwc">${lbl("Spare")}<h3>One of your own</h3><div>Optional.</div></div></div>`);

  const A_DRAFT = {
    statement: `Help can be offered and still not land. If you learned early that you would not be heard, care can be hard to take in.`,
    explanation: `<div class="quote">${qt("most_people")}</div><div class="quote">${qt("receiver_delivery")}</div>`,
    model: `The response you expect · the response you get · a chance to look again. <span class="small">From our framework guide. Yours to change.</span>`,
    metaphor: `<div class="quote">${qt("receiver_broken")}</div><span class="small">Your image for your own experience. With other people, avoid calling anyone broken.</span>`,
    story: `<div class="quote">${qt("booth_wait")}</div><div class="quote">${qt("booth_kid")}</div>`,
    evidence: `<span class="small">Left blank on purpose. What supports this beyond your story?</span>`,
    action: `<span class="small">Left blank on purpose. What could a person do this week to test whether care is getting through?</span>`,
  };
  const research = (key) => `<button type="button" class="tog ${str(key) === "to research" ? "on" : ""}" data-act="research" data-k="${key}" style="margin-top:8px">Mark as "to research"</button>`;
  add("i_A", "ideas", "The broken receiver", () => `
    ${lbl("Idea A · Half filled")}<h1>The broken receiver</h1>
    <p>On the left is a draft from your manuscript. On the right, write your version. Keep what is true. Change what is not.</p>
    ${PS.map(([k, t]) => `<div class="pair"><div class="draft">${lbl(t)}${A_DRAFT[k]}</div><div class="f core"><label for="i_A_${k}">Your version</label><textarea id="i_A_${k}" data-k="i_A_${k}" rows="3">${esc(A["i_A_" + k] || "")}</textarea>${k === "evidence" ? research("i_A_evidence") : ""}</div></div>`).join("")}`,
    () => PS.map(([k]) => has("i_A_" + k)));

  const PROMPT = {
    B: { statement: "What did that one word let you do? Say it as one plain sentence.", explanation: "Why did it work on you? What did he not do?", model: "What are the two or three parts, in order?", metaphor: "Is there an image for a reply that leaves room?", story: "Tell the arrival in three or four sentences. Keep it short.", evidence: "What would show this is true for other people?", action: "What could a young adult, or their friend, do this week that uses this idea?" },
    C: { statement: "What do you want a young adult to know about \"serious enough\"? One sentence.", explanation: "What did comparing yourself to worse cases do for you?", model: "What replaces the severity bar? For example: notice · describe · ask.", metaphor: "An image for a first conversation that is not a test.", story: "A time you decided it was not bad enough. Short, and no graphic detail.", evidence: "Who could you ask? Six to eight young adults is a start.", action: "One question a person could ask without choosing a label." },
  };
  const STRIP = {
    B: `<div class="card">${lbl("From your manuscript")}<div class="quote">${qt("okay_not_debate")}</div><div class="quote">${qt("okay_no_argue")}</div></div>`,
    C: `<div class="card">${lbl("From your positioning brief")}<div class="quote">${qt("entry_moment", "positioning brief")}</div>${lbl("From your preface")}<div class="quote">${qt("preface_willing")}</div></div>`,
  };
  ["B", "C"].forEach((sid) => add("i_" + sid, "ideas", SHEETS.find((s) => s.id === sid).title, () => `
    ${lbl("Idea " + sid + " · Blank with prompts")}<h1>${SHEETS.find((s) => s.id === sid).title}</h1>
    ${STRIP[sid]}
    ${PS.map(([k, t]) => fText("i_" + sid + "_" + k, t, PROMPT[sid][k], k === "story" ? 4 : 3, true) + (k === "evidence" ? research("i_" + sid + "_evidence") : "")).join("")}`,
    () => PS.map(([k]) => has("i_" + sid + "_" + k))));
  add("i_D", "ideas", "A spare idea", () => `
    ${lbl("Spare · Optional")}<h1>An idea of your own</h1>
    <p>Two more from our framework guide that you could use: <b>They answered</b> and <b>Willingness before certainty</b>. Or bring your own.</p>
    ${fShort("i_D_title", "Name the idea", "")}
    ${PS.map(([k, t]) => fText("i_D_" + k, t, PS_DEF[k], 3)).join("")}`);
  add("i_way", "ideas", "Waypoint", () => {
    const full = (sid) => PS.every(([k]) => has("i_" + sid + "_" + k));
    return waypoint("ideas", "Three ideas you can teach.", "Each one now has a statement, a story and one small action. Next you build the stages.",
      [[String(["A", "B", "C"].filter(full).length), "of 3 ideas complete"], [String(["A", "B", "C", "D"].reduce((n, s) => n + (has("i_" + s + "_action") ? 1 : 0), 0)), "small actions"]],
      [[full("A"), "The broken receiver has all seven parts.", "i_A"], [full("B"), "Okay has all seven parts.", "i_B"], [full("C"), "It's not serious enough has all seven parts.", "i_C"]]);
  }, null, { way: true });

  /* ===== Part 4 · Your stages ===== */
  add("st_choose", "stages", "Choose your stages", () => `
    ${lbl("Part 5")}<h1>Your stages</h1>
    <p class="lead">Decide the stages of your method, in your words.</p>
    ${why("The stages are the spine of the framework. They need to be yours. Our suggestion is only a suggestion. A renamed or rejected stage is a good result if you know why.")}
    <p class="small">Your original five: Notice · Journal · Connect · Explore · Implement and Repeat.</p>
    ${SR.map(([o, v, n], i) => `<div class="strow"><div class="hd"><span class="from">${o}</span><span class="small">&rsaquo;</span><span class="to">${v}</span></div><p class="small" style="margin:2px 0 0">${n}</p>
      <div class="seg">${["accept", "rename", "reject"].map((c) => `<button type="button" class="${A["st_call" + i] === c ? "on" : ""}" data-act="call" data-i="${i}" data-v="${c}">${c[0].toUpperCase() + c.slice(1)}</button>`).join("")}</div>
      ${A["st_call" + i] === "rename" ? `<div class="f core"><label>Your name for it</label><input type="text" data-k="st_name${i}" value="${esc(A["st_name" + i] || "")}"></div>` : ""}
      <div class="f"><label>Why?</label><input type="text" data-k="st_why${i}" value="${esc(A["st_why" + i] || "")}"></div></div>`).join("")}`,
    () => SR.map((_, i) => !!A["st_call" + i] && (A["st_call" + i] !== "rename" || has("st_name" + i))));

  add("st_shape", "stages", "The shape", () => `
    ${lbl("Part 5")}<h1>The shape</h1>
    <p class="lead">Is your method a line, a loop, or something else?</p>
    <div class="shapes">${[
      ["line", "A line", "One stage after another.", `<line x1="8" y1="23" x2="112" y2="23" stroke="#2d6655" stroke-width="1.5"/><circle cx="8" cy="23" r="4" fill="#2abf91"/><circle cx="42" cy="23" r="4" fill="#2abf91"/><circle cx="78" cy="23" r="4" fill="#2abf91"/><circle cx="112" cy="23" r="4" fill="#2abf91"/>`],
      ["loop", "A loop", "You come back around.", `<ellipse cx="60" cy="23" rx="36" ry="17" fill="none" stroke="#2d6655" stroke-width="1.5"/><circle cx="24" cy="23" r="4" fill="#2abf91"/><circle cx="60" cy="6" r="4" fill="#2abf91"/><circle cx="96" cy="23" r="4" fill="#2abf91"/><circle cx="60" cy="40" r="4" fill="#2abf91"/>`],
      ["other", "Something else", "A spiral, a map, a trail.", `<path d="M10 34 C 30 2, 50 44, 70 16 S 100 10, 112 30" fill="none" stroke="#2d6655" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="10" cy="34" r="4" fill="#2abf91"/><circle cx="112" cy="30" r="4" fill="#2abf91"/>`],
    ].map(([v, t, d, svg]) => `<button type="button" class="shape ${A.st_shape === v ? "on" : ""}" data-act="shape" data-v="${v}"><svg viewBox="0 0 120 46">${svg}</svg>${lbl(t)}<div class="small">${d}</div></button>`).join("")}</div>
    ${fShort("st_enter", "Where does a person enter?", "", true)}
    ${fShort("st_skip", "Can they skip a stage?", "")}
    ${fShort("st_back", "What brings them back?", "")}
    ${fText("st_shape_note", "Describe the shape in a sentence or two", "Optional. If you draw it on paper, keep the drawing for your first check-in.", 3)}`,
    () => [!!A.st_shape, has("st_enter")]);

  finalStages().forEach((st, idx, all) => {
    const i = st.i, p = "sc" + i + "_", sm = selMoments();
    add("st_card_" + i, "stages", st.name, () => `
      ${lbl("Stage " + (idx + 1) + " of " + all.length)}<h1>${esc(st.name)}</h1>
      <p>Write this so a stranger could run it without you in the room.</p>
      ${exBox(`<div class="exgrid">
        ${lbl("Struggling with")}<div>Not knowing who to tell, or how to start.</div>
        ${lbl("Question")}<div>${qt("guide_connect_q", "framework guide")}</div>
        ${lbl("Practice")}<div>1. Pick one person or service. Pick one backup.<br>2. Decide what you want from them: listening, information, practical help, or professional care.<br>3. Write your opening sentence. One you already use: ${qt("opening_sentence", "speaker sheet")}<br>4. Say it out loud once, on your own.<br>5. Choose when you could say or send it. Sending is always your choice.</div>
        ${lbl("May help because")}<div>Asking may feel less risky once you have picked the person and the first sentence.</div>
        ${lbl("Leaves with")}<div>A person or service, an opening sentence, and a backup.</div>
        ${lbl("Made-up example")}<div>Sam picks an older sister. The backup is a GP appointment. Sam's opening: ${qt("guide_unsure", "framework guide")}</div>
        ${lbl("Watch out for")}<div>Don't push anyone to send the message on the spot. A caring reply cannot be promised. Friends can listen, but they are not trained professionals.</div>
      </div>`, "See a worked card · Connect · Draft for Chris to rewrite")}
      ${fText(p + "struggle", "The person is struggling with", "What is hard for them at this point?", 2, true)}
      ${fShort(p + "question", "The one question this stage asks", "", true)}
      <div class="f core acts"><div class="flabel">The practice · three to five small actions</div><p class="help">In order. Each one should take minutes, and work with a made-up example.</p>
        ${acts(i).map((v, n) => `<div class="arow"><span class="an">${n + 1}</span><input type="text" data-acts="${i}" data-n="${n}" value="${esc(v)}"></div>`).join("")}</div>
      ${fText(p + "why", "This may help because", "Your best explanation. Say \"may\" where you are not sure.", 3, true)}
      ${sm.length ? fChips(p + "moment", "A scene from your story", "Pick the moment that shows this stage.", sm.map((id) => [id, esc(momentTitle(id))]), false) : ""}
      ${fText(p + "scene", "Tell that scene in two or three sentences", "Optional.", 3)}
      ${fText(p + "leaves", "What the person leaves with", "Something they can hold: a name, a sentence, a plan.", 2, true)}
      ${fText(p + "example", "A made-up young adult doing it", "No real person. A few sentences.", 3, true)}
      ${fText(p + "watch", "Watch out for, and its limits", "How could this go wrong, or put pressure on someone? What does it not do?", 3, true)}`,
      () => [has(p + "struggle"), has(p + "question"), acts(i).filter((v) => (v || "").trim()).length >= 3, has(p + "why"), has(p + "leaves"), has(p + "example"), has(p + "watch")]);
  });
  if (loopOn()) add("st_loop", "stages", stageName(5) + " (the loop)", () => `
    ${lbl("The loop")}<h1>${esc(stageName(5))}</h1>
    <p class="lead">The loop is not a stage. It is permission to come back.</p>
    ${fText("loop_when", "When might a person come back?", "", 3, true)}
    ${fText("loop_optional", "What stays optional, always?", "For example: they never have to keep telling people.", 3, true)}
    ${fText("loop_sentence", "One sentence you would say to someone who comes back", "Optional.", 2)}`,
    () => [has("loop_when"), has("loop_optional")]);
  add("st_way", "stages", "Waypoint", () => {
    const fs = finalStages(), done = fs.filter((s) => screenById("st_card_" + s.i) && screenById("st_card_" + s.i).req().every(Boolean)).length;
    return waypoint("stages", "The spine is built.", "Your stages now have questions, practices and limits. One thing is left: a name.",
      [[String(fs.length), "stages"], [String(done), "cards complete"], [A.st_shape ? "1" : "0", "shape chosen"]],
      [[SR.every((_, i) => !!A["st_call" + i]), "Every row has a choice.", "st_choose"], [!!A.st_shape && has("st_enter"), "You chose a shape and a way in.", "st_shape"],
       [fs.length > 0 && done === fs.length, `Every stage card is complete. ${done} of ${fs.length} done.`, (fs.find((s) => !screenById("st_card_" + s.i).req().every(Boolean)) || {}).i !== undefined ? "st_card_" + fs.find((s) => !screenById("st_card_" + s.i).req().every(Boolean)).i : "st_choose"],
       [!loopOn() || (has("loop_when") && has("loop_optional")), "The loop is described.", "st_loop"]]);
  }, null, { way: true });

  /* ===== Part 5 · Name it ===== */
  add("n_names", "name", "Name ideas", () => `
    ${lbl("Part 6")}<h1>Name it</h1>
    <p class="lead">Give your framework a name that passes five tests.</p>
    ${why("A name makes the framework easy to remember and easy to pass on. It comes last on purpose. A good name describes something that already works.")}
    <div class="card">${CRIT.map((c, i) => `<div style="display:flex;gap:10px;align-items:center;margin:4px 0"><span class="rn" style="flex-basis:26px;width:26px;height:26px;font-size:13px">${i + 1}</span><b>${c}</b></div>`).join("")}</div>
    ${exBox(`<p><b>Testing a name: "The Practice of Return"</b></p><p>Easy to say: yes. Fits your voice: yes. Chapter Ten of your manuscript is called ${qt("daily_return_title")}. Makes no promise: yes.</p><p><b>The problem.</b> In addiction language, "return to use" means relapse. Someone could hear the opposite of what you mean. So avoid "Return" in the name.</p>`)}
    ${names().map((r, i) => `<div class="row"><span class="rnum">${i + 1}</span>
      <div class="f"><label>Name idea</label><input type="text" data-list="names" data-i="${i}" data-f="n" value="${esc(r.n)}"></div>
      <div class="f"><div class="flabel">Which tests does it pass?</div><div class="chips">${CRIT.map((c, j) => `<button type="button" class="chip ${r.t[j] ? "on" : ""}" data-act="crit" data-i="${i}" data-j="${j}">${j + 1}. ${c}</button>`).join("")}</div></div>
      <div class="f"><button type="button" class="tog ${A.name_final === i && r.n.trim() ? "on" : ""}" data-act="finalname" data-i="${i}">This is the one, for now</button></div></div>`).join("")}`,
    () => [names().filter((r) => r.n.trim()).length >= 3, !!finalName()]);

  add("n_promise", "name", "What it does", () => `
    ${lbl("Part 6")}<h1>What it does, and how it helps</h1>
    <p class="lead">Say it plainly. This goes at the top of your one-page summary.</p>
    ${exBox(`<p><b>What it does.</b> It helps a young adult who looks fine on the outside to get ready to ask for help, and to let it in, before things become a crisis.</p><p><b>How it helps.</b> It gives them words for what is wrong, one person to tell, and one sentence to start with. It does not ask for a label or a crisis first.</p><p><b>What it is not.</b> It is not treatment. It does not replace professional care. It is about readiness, not recovery.</p><p class="small">Built from your positioning brief and the three rules. Yours to rewrite.</p>`)}
    ${fText("n_does", "What does it do? One sentence.", "A pattern you can use: it helps (who) to (do what) before (what).", 3, true)}
    ${fText("n_helps", "How does it help them?", "Two or three sentences. What do they have afterwards that they did not have before?", 4, true)}
    ${fText("n_not", "What is it not?", "The honest edge. Every strong framework has one.", 3, true)}`,
    () => [has("n_does"), has("n_helps"), has("n_not")]);

  add("n_two", "name", "Two-minute explanation", () => `
    ${lbl("Part 6")}<h1>Your two-minute explanation</h1>
    <p class="lead">Five beats. The same five as your speaker sheet.</p>
    <p>Your speaker sheet runs ${qt("sheet_sequence", "speaker sheet")}. There you introduce the book. Here you explain the framework.</p>
    ${exBox(`<p><b>Beat 5 · Invitation.</b> Your speaker sheet offers one opening sentence: ${qt("opening_sentence", "speaker sheet")}</p><p>For the framework, you might add: "That sentence is the Connect stage. There are four more, and you can start with any of them."</p>`)}
    ${BEATS.map(([b, t, h], i) => fText("n_b" + (i + 1), `${i + 1}. ${b} <span class="pg">${t}</span>`, h, 3, true)).join("")}`,
    () => BEATS.map((_, i) => has("n_b" + (i + 1))));

  add("n_way", "name", "Waypoint", () => waypoint("name", "It has a name.", "That was the last piece. Your framework is ready to read on one page.",
    [[String(names().filter((r) => r.n.trim()).length), "names tried"], [finalName() ? "1" : "0", "chosen"]],
    [[names().filter((r) => r.n.trim()).length >= 3, "You tried at least three names.", "n_names"], [!!finalName(), "You chose one, for now.", "n_names"],
     [has("n_does") && has("n_helps") && has("n_not"), "You said what it does, how it helps, and what it is not.", "n_promise"], [BEATS.every((_, i) => has("n_b" + (i + 1))), "Your two-minute explanation has all five beats.", "n_two"]], "sum"), null, { way: true });

  /* ===== Summit · Your framework ===== */
  add("sum", "summary", "Your framework on one page", () => summaryHTML(), null, { way: true });

  /* ===== Next leg · Test it ===== */
  add("t_claims", "test", "Claim check", () => `
    ${lbl("Next leg · Test it")}<h1>Claim check</h1>
    <p class="lead">Sort what you say into what happened, what you think, what is an image, and what needs proof.</p>
    ${why("People will ask how you know. So will anyone who might host you. Sorting your claims now protects your credibility. It also keeps your story, which no one can argue with, apart from the science, which they can.")}
    <div class="fw">${TYPES.map(([t, d]) => `<div class="fwc">${lbl(t)}<div>${d}</div></div>`).join("")}</div>
