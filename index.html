const clip = (s, n) => (s.length > n ? s.slice(0, n).trim() + "..." : s);

/* ---------------- render + navigation ---------------- */
function render() {
  _cache = null;
  let s = screenById(cur); if (!s) { cur = allScreens()[0].id; s = screenById(cur); }
  const L = allScreens(), i = L.indexOf(s), prev = L[i - 1], next = L[i + 1];
  const o = overall();
  const back = cur === "s_welcome" && o.done > 0 && S.last && S.last !== "s_welcome" && screenById(S.last)
    ? `<div class="note" style="margin-bottom:18px"><b>Welcome back.</b> You are ${o.pct}% of the way. <button type="button" class="go" data-act="go" data-id="${S.last}" style="background:none;border:0;color:var(--deep);text-decoration:underline;font:inherit">Carry on where you left off</button></div>` : "";
  document.getElementById("screen").innerHTML = back + s.render() + `<div class="nav">${prev ? `<button type="button" class="btn ghost" data-act="go" data-id="${prev.id}">Back</button>` : ""}<span class="left">${!s.way && s.req().length ? s.req().filter(Boolean).length + " of " + s.req().length + " needed answers on this screen" : ""}</span>${next ? `<button type="button" class="btn" data-act="go" data-id="${next.id}">${cur === "s_welcome" ? "Begin" : "Continue"}</button>` : ""}</div>`;
  S.seen[cur] = true; if (cur !== "s_welcome") S.last = cur; S.cur = cur;
  paintChrome(); save();
}
function go(id) { cur = id; closeDrawers(); render(); window.scrollTo(0, 0); const m = document.querySelector(".main"); if (m) m.scrollTop = 0; }
function closeDrawers() { ["rail", "side", "scrim"].forEach((id) => document.getElementById(id).classList.remove("open")); }
function softRefresh() { _cache = null; paintChrome(); const s = screenById(cur), left = document.querySelector(".nav .left"); if (s && left && !s.way && s.req().length) left.textContent = s.req().filter(Boolean).length + " of " + s.req().length + " needed answers on this screen"; }

/* ---------------- events ---------------- */
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.k) { A[t.dataset.k] = t.value; }
  else if (t.dataset.list) { A[t.dataset.list][+t.dataset.i][t.dataset.f] = t.value; }
  else if (t.dataset.acts) { acts(+t.dataset.acts)[+t.dataset.n] = t.value; }
  else if (t.dataset.custom !== undefined) { custom()[+t.dataset.custom].title = t.value; }
  else return;
  save(); softRefresh();
});
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-chip],[data-act]"); if (!t) return;
  const d = t.dataset;
  if (d.chip) {
    if (d.chip === "m") { const a = arr(d.k).slice(), i = a.indexOf(d.v); if (i >= 0) a.splice(i, 1); else { if (d.max && a.length >= +d.max) a.shift(); a.push(d.v); } A[d.k] = a; }
    else A[d.k] = A[d.k] === d.v ? "" : d.v;
    save(); return render();
  }
  switch (d.act) {
    case "go": return go(d.id);
    case "rule": A["rule" + d.i] = !A["rule" + d.i]; break;
    case "addcustom": custom().push({ id: "u" + Date.now().toString(36), title: "" }); break;
    case "addrow": ({ sentences, claims, log: logRows })[d.list](); A[d.list].push(d.list === "sentences" ? { s: "", barriers: [], young: false, how: "" } : d.list === "claims" ? { s: "", type: "", call: "", rw: "" } : { date: "", who: "", ex: "Connect", confused: "", produced: "", change: "" }); break;
    case "delrow": A[d.list].splice(+d.i, 1); break;
    case "setrow": A[d.list][+d.i][d.f] = A[d.list][+d.i][d.f] === d.v ? "" : d.v; break;
    case "barrier": { const r = sentences()[+d.i]; r.barriers = r.barriers || []; const i = r.barriers.indexOf(d.v); if (i >= 0) r.barriers.splice(i, 1); else r.barriers.push(d.v); break; }
    case "young": sentences()[+d.i].young = !sentences()[+d.i].young; break;
    case "research": A[d.k] = str(d.k) === "to research" ? "" : "to research"; break;
    case "call": A["st_call" + d.i] = d.v; break;
    case "shape": A.st_shape = d.v; break;
    case "crit": names()[+d.i].t[+d.j] = names()[+d.i].t[+d.j] ? 0 : 1; break;
    case "finalname": A.name_final = A.name_final === +d.i ? null : +d.i; break;
    case "pdf": return makePDF(d.kind);
    case "mail": return void (location.href = "mailto:?subject=" + encodeURIComponent("My framework · " + (d.kind === "all" ? "everything" : (PARTS.find((p) => p.id === d.kind) || {}).name || "")) + "&body=" + encodeURIComponent("Hi Ari,\n\nAttached is my work from the framework builder.\n\nChris"));
    case "backup": return backup();
    case "restore": return document.getElementById("restorefile").click();
    case "openrail": document.getElementById("rail").classList.add("open"); document.getElementById("scrim").classList.add("open"); return;
    case "openside": document.getElementById("side").classList.add("open"); document.getElementById("scrim").classList.add("open"); return;
    case "closedrawers": return closeDrawers();
    default: return;
  }
  save(); render();
});
document.getElementById("restorefile").addEventListener("change", (e) => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (d && d.a) { Object.keys(A).forEach((k) => delete A[k]); Object.assign(A, d.a); S.seen = d.seen || {}; S.last = d.last || null; save(); go("s_welcome"); } } catch (err) { alert("That file could not be read. Choose a backup made by this page."); } };
  r.readAsText(f); e.target.value = "";
});

/* ---------------- export ---------------- */
function sections(kind) {
  const out = [], P = (title) => { const s = { title, items: [] }; out.push(s); return s.items; };
  const want = (p) => kind === "all" || kind === p;
  if (want("start")) { const it = P("Start here"); it.push(["From the outside, this person looks like", str("aud_outside")], ["On the inside, what is true", str("aud_inside")], ["What I would want this person to hear", str("aud_person")], ["What my framework should have", arr("fw_elements").join(" · ")], ["A framework I admire", str("fw_admire")]); }
  if (want("moments")) { selMoments().forEach((id, n) => { const it = P("Moment " + (n + 1) + " · " + momentTitle(id) + (momentPage(id) ? " (" + momentPage(id) + ")" : "")); MF.forEach(([k, t]) => it.push([t, str("m_" + id + "_" + k)])); }); const it = P("My strongest moments"); it.push(["Strongest three", arr("m_top").map(momentTitle).join(" · ")], ["What they have in common", str("m_pattern")]); }
  if (want("before")) { const it = P("Before asking · My sentences"); filledSent().forEach((r, n) => it.push(["Sentence " + (n + 1), r.s + "\nBarrier: " + ((r.barriers || []).join(", ") || "not chosen") + "\nA young adult would say it: " + (r.young ? "yes" : "no") + (r.how ? "\nHow they might say it: " + r.how : "")])); it.push(["The one I wish someone had questioned", str("b_one")], ["What might have happened", str("b_one_why")]); }
  if (want("ideas")) { [...SHEETS, { id: "D", title: str("i_D_title") || "Spare idea" }].forEach((sh) => { if (sh.id === "D" && !PS.some(([k]) => has("i_D_" + k))) return; const it = P("Idea " + sh.id + " · " + sh.title); PS.forEach(([k, t]) => it.push([t, str("i_" + sh.id + "_" + k)])); }); }
  if (want("stages")) { let it = P("My stages · Choices"); SR.forEach(([o, v], i) => it.push([o + " > " + v, (A["st_call" + i] || "no choice yet") + (A["st_call" + i] === "rename" ? ": " + str("st_name" + i) : "") + (has("st_why" + i) ? "\nWhy: " + str("st_why" + i) : "")])); it.push(["Shape", A.st_shape || ""], ["Where a person enters", str("st_enter")], ["Can they skip a stage", str("st_skip")], ["What brings them back", str("st_back")], ["The shape, described", str("st_shape_note")]);
    finalStages().forEach((s, n) => { const p = "sc" + s.i + "_"; it = P("Stage " + (n + 1) + " · " + s.name); it.push(["The person is struggling with", str(p + "struggle")], ["The question", str(p + "question")], ["The practice", acts(s.i).filter((v) => (v || "").trim()).map((v, m) => (m + 1) + ". " + v).join("\n")], ["This may help because", str(p + "why")], ["Scene from my story", [momentTitle(A[p + "moment"] || ""), str(p + "scene")].filter(Boolean).join("\n")], ["What the person leaves with", str(p + "leaves")], ["A made-up young adult doing it", str(p + "example")], ["Watch out for, and its limits", str(p + "watch")]); });
    if (loopOn()) { it = P("The loop · " + stageName(5)); it.push(["When a person might come back", str("loop_when")], ["What stays optional", str("loop_optional")], ["What I would say to someone who comes back", str("loop_sentence")]); } }
  if (want("name")) { let it = P("Name it"); names().filter((r) => r.n.trim()).forEach((r, n) => it.push(["Name idea " + (n + 1) + (A.name_final === names().indexOf(r) ? " (chosen)" : ""), r.n + "\nPasses: " + (CRIT.filter((_, j) => r.t[j]).join(", ") || "none ticked")])); it.push(["What it does", str("n_does")], ["How it helps", str("n_helps")], ["What it is not", str("n_not")]); it = P("Two-minute explanation"); BEATS.forEach(([b, t], i) => it.push([b + " (" + t + ")", str("n_b" + (i + 1))])); }
  if (want("test")) { let it = P("Claim check"); CLAIM_EX.forEach(([id], i) => it.push(['"' + Q[id].text + '" (p. ' + Q[id].page + ")", str("t_ex" + (i + 1))])); claims().filter((r) => r.s.trim()).forEach((r, n) => it.push(["Claim " + (n + 1), r.s + "\nType: " + (r.type || "not chosen") + " · Call: " + (r.call || "not chosen") + (r.rw ? "\nRewrite: " + r.rw : "")])); it = P("Test log"); logRows().filter((r) => (r.who || "").trim()).forEach((r, n) => it.push(["Person " + (n + 1) + " · " + r.who + (r.date ? " · " + r.date : ""), "Confused by: " + r.confused + "\nProduced: " + r.produced + "\nTo change: " + r.change])); }
  return out;
}
function summarySections() {
  const fs = finalStages(), out = [];
  out.push({ title: finalName() || "Unnamed framework", items: [["What it does", str("n_does")], ["Who it is for · from the outside", str("aud_outside")], ["Who it is for · on the inside", str("aud_inside")], ["Where a person starts", '"' + Q.entry_moment.text + '"']] });
  out.push({ title: "The stages", items: fs.map((s, n) => [(n + 1) + ". " + s.name, [str("sc" + s.i + "_question"), has("sc" + s.i + "_leaves") ? "Leaves with: " + str("sc" + s.i + "_leaves") : ""].filter(Boolean).join("\n")]).concat(loopOn() ? [[stageName(5) + " (the loop)", str("loop_when") || "A person can come back to any stage."]] : []) });
  out.push({ title: "How it helps", items: [["In my words", str("n_helps")]].concat(fs.filter((s) => has("sc" + s.i + "_struggle") && has("sc" + s.i + "_why")).map((s) => [s.name, "When a person is struggling with " + lower(str("sc" + s.i + "_struggle")) + ", this stage may help because " + lower(str("sc" + s.i + "_why")) + "."])) });
  out.push({ title: "The edges", items: [["Where a person finishes", '"' + Q.success_line.text + '"'], ["What it is not", str("n_not")], ["Built from", selMoments().length + " moments, " + filledSent().length + " sentences, " + ["A", "B", "C", "D"].filter((s) => has("i_" + s + "_statement")).length + " big ideas."], ["Status", "A working draft. Untested until it has been tried with real people. It is not treatment."]] });
  return out;
}
const pdfSafe = (s) => String(s).replace(/›/g, ">").replace(/[✓✔]/g, "x").replace(/[^\x20-\xFF\n‘’“”…]/g, "");
function makePDF(kind) {
  if (!(window.jspdf && window.jspdf.jsPDF)) { alert("The PDF tool did not load. Check your connection and reload the page. Your answers are safe."); return; }
  const doc = new window.jspdf.jsPDF({ unit: "pt", format: "a4" }), L = 56, W = 483, B = 780; let y = 64;
  const room = (n) => { if (y + n > B) { doc.addPage(); y = 64; } };
  const put = (text, size, style, color, gap) => { doc.setFont("helvetica", style); doc.setFontSize(size); doc.setTextColor(color); doc.splitTextToSize(pdfSafe(text), W).forEach((ln) => { room(size * 1.38); doc.text(ln, L, y); y += size * 1.38; }); y += gap; };
  const secs = kind === "summary" ? summarySections() : sections(kind);
  const label = kind === "summary" ? "One-page summary" : kind === "all" ? "Everything so far" : (PARTS.find((p) => p.id === kind) || {}).name;
  put("Build Your Framework · Chris", 9, "bold", "#2d6655", 2);
  put(kind === "summary" ? (finalName() || "My framework") : label, 18, "bold", "#0e1f19", 4);
  put(new Date().toLocaleDateString() + " · " + overall().pct + "% complete · prepared with Mint Mantis", 9, "normal", "#666666", 14);
  secs.forEach((s) => { room(50); put(s.title, 12.5, "bold", "#0e1f19", 6); s.items.forEach(([l, v]) => { room(34); put(l, 9.5, "bold", "#2d6655", 1); put(v && String(v).trim() ? v : "(not answered yet)", 10.5, v && String(v).trim() ? "normal" : "italic", v && String(v).trim() ? "#1a1a1a" : "#999999", 9); }); y += 8; });
  doc.save("Chris-Framework-" + (kind === "summary" ? "One-Pager" : kind === "all" ? "Everything" : label.replace(/\s+/g, "-")) + ".pdf");
}
function backup() {
  const blob = new Blob([JSON.stringify({ a: A, seen: S.seen, last: S.last, at: new Date().toISOString() })], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "chris-framework-backup.json"; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------------- boot ---------------- */
window.__app = { A, S, go, allScreens, overall, partStats, finalStages, sections, summarySections };
cur = "s_welcome";
render();
</script>
